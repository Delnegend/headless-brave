name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  # Weekly: the base image can change with no commit.
  schedule:
    - cron: '17 4 * * 1'
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check (just check)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Run checks
        run: just check

  smoke:
    name: Container (build + install)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          tags: headless-brave:smoke
          # Shares cache with the release build.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start it
        # --shm-size=2g matches compose; Chromium needs more than the 64 MB default.
        run: >
          docker run -d --name smoke --shm-size=2g
          -p 127.0.0.1:18000:8000
          headless-brave:smoke

      - name: The browser installed, unprivileged
        run: |
          # Stopped container: `cp` reads it, `exec` needs it running.
          for _ in $(seq 1 30); do
            if docker cp smoke:/opt/brave.com/VERSION /tmp/VERSION 2>/dev/null; then
              echo "installed $(cat /tmp/VERSION)"
              exit 0
            fi
            sleep 5
          done
          echo "the browser never finished installing" >&2
          exit 1

      - name: The unusable SUID helper is gone
        run: |
          # Chromium picks it over the namespace fallback, then aborts.
          if docker cp smoke:/opt/brave.com/brave-origin/chrome-sandbox /tmp/helper 2>/dev/null; then
            echo "the unusable SUID sandbox helper is still installed" >&2
            exit 1
          fi

      - name: It is configured to run unprivileged
        run: |
          test "$(docker inspect smoke --format '{{.Config.User}}')" = "headless"

      - name: It fails in the documented way here
        run: |
          # No sandbox here, so stopping with a clear reason is expected.
          for _ in $(seq 1 30); do
            state=$(docker inspect smoke --format '{{.State.Running}}' 2>/dev/null || echo gone)
            [ "$state" = "false" ] && break
            [ "$state" = "gone" ] && break
            sleep 5
          done
          docker logs smoke > /tmp/smoke.log 2>&1 || true
          grep -qE "No usable sandbox" /tmp/smoke.log \
            || grep -qE "Brave .*exited" /tmp/smoke.log \
            || { echo "the container stopped without saying why"; exit 1; }

      - name: What happened
        if: always()
        run: |
          echo "=== container state ==="
          docker ps -a --filter name=smoke --format '{{.Status}}'
          echo "=== exit code ==="
          docker inspect smoke --format '{{.State.ExitCode}}' || true
          echo "=== the supervisor's own log, and anything fatal ==="
          # Supervisor speaks first; fluxbox noise filtered below.
          grep -iE "headless-brave|error|fatal|sandbox|namespace|exited" /tmp/smoke.log \
            | grep -viE "Failed to read|Setting default value" | head -30 || true

      - name: Clean up
        if: always()
        run: docker rm -f smoke || true

  scan:
    name: Scan
    uses: Delnegend/actions/.github/workflows/scan.yml@0e55ed74d7039e8f1f5b23607345eefaef65d8b4 # v1
    permissions:
      contents: read
