name: Auto-merge dependencies and releases

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    uses: Delnegend/actions/.github/workflows/reusable-auto-merge.yml@main  # nosemgrep
    with:
      extra-head-prefix: 'release/'
