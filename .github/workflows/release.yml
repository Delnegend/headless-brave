name: Release / Build Artifacts

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Step 1 = prepare the next version (bump + PR). Step 2 = publish it (tag + build + release). Run step 2 after the PR merges."
        required: true
        type: choice
        default: "prepare-release"
        options:
          - prepare-release  # Step 1: calculate version, bump manifest, open/update release PR. No tag, no build.
          - publish          # Step 2: tag merged main from the manifest (or rebuild ref below), then build & publish.
      ref:
        description: "publish only: rebuild this existing tag instead of tagging main. Leave empty for a normal publish."
        required: false
        type: string
      dry-run:
        description: "Preview only: print each action (bump, PR, tag, publish) without doing any of it."
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '0 0 * * 0' # Weekly: Sunday 00:00 UTC (runs prepare-release)

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  # Lowercase on purpose: buildx normalises the name on push, so `Delnegend`
  # is what the build logs show and `delnegend` is what anyone can pull.
  IMAGE: ghcr.io/delnegend/headless-brave

jobs:
  prepare:
    name: Prepare (bump, or resolve tag to build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
      version: ${{ steps.resolve.outputs.version }}
      publish: ${{ steps.resolve.outputs.publish }}
      skip: ${{ steps.resolve.outputs.skip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ github.token }}
          persist-credentials: true
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      # ------------------------------------------------------------------
      # prepare-release: semver -> CI gate -> bump -> open/update release PR
      # ------------------------------------------------------------------
      - name: Calculate Next SemVer
        if: (inputs.target || 'prepare-release') == 'prepare-release'
        id: semver
        uses: ietf-tools/semver-action@c90370b2958652d71c06a3484129a4d423a6d8a8 # v1
        with:
          token: ${{ github.token }}
          fallbackTag: v0.0.0
          noNewCommitBehavior: silent
          noVersionBumpBehavior: patch

      - name: CI Gate (verify code is green before bumping)
        if: (inputs.target || 'prepare-release') == 'prepare-release' && steps.semver.outputs.bump != 'none'
        run: just check

      - name: Bump package manager version
        if: (inputs.target || 'prepare-release') == 'prepare-release' && steps.semver.outputs.bump != 'none'
        env:
          NEXT_STRICT: ${{ steps.semver.outputs.nextStrict }}
        run: |
          set -euo pipefail
          just bump "$NEXT_STRICT"

      - name: Commit and open release PR
        if: (inputs.target || 'prepare-release') == 'prepare-release' && steps.semver.outputs.bump != 'none'
        id: release-pr
        env:
          NEXT_TAG: ${{ steps.semver.outputs.next }}
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "actions@users.noreply.github.com"

          git add -u
          if git diff --staged --quiet; then
            # Idempotent re-run: the bump already landed (PR merged, or this
            # exact version was prepared before). Nothing to do.
            echo "Manifest already at $NEXT_TAG; nothing to bump."
            echo "branch=release/$NEXT_TAG" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore(release): ${NEXT_TAG}"

          BRANCH="release/${NEXT_TAG}"
          if [ "$DRY_RUN" = "true" ]; then
            echo "[dry-run] would push $BRANCH and open/update the release PR"
            echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Idempotent: reset the branch if a previous run left it behind,
          # overwrite only the bot's own branch, reuse the open PR.
          git checkout -B "$BRANCH"
          git push --force-with-lease -u origin "$BRANCH"

          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          if gh pr view "$BRANCH" >/dev/null 2>&1; then
            echo "Release PR already open; updated the branch."
          else
            gh pr create --title "chore(release): ${NEXT_TAG}" \
              --body "Automated version bump to \`${NEXT_TAG}\`. Auto-merge takes it once checks are green; then run this workflow with \`target=publish\` to tag, build, and publish." \
              --head "$BRANCH" --base main
          fi

      # -----------------------------------------------------------------------
      # Resolve outputs for Job 2 (build)
      # -----------------------------------------------------------------------
      - name: Resolve outputs
        id: resolve
        env:
          TARGET: ${{ inputs.target || 'prepare-release' }}
          INPUT_REF: ${{ inputs.ref }}
          DRY_RUN: ${{ inputs.dry-run }}
          BUMP: ${{ steps.semver.outputs.bump }}
          CURRENT: ${{ steps.semver.outputs.current }}
          NEXT: ${{ steps.semver.outputs.next }}
          NEXT_STRICT: ${{ steps.semver.outputs.nextStrict }}
        run: |
          set -euo pipefail
          # prepare-release only opens/updates the release PR (branch
          # protection blocks a direct push to main). Nothing to build yet.
          if [ "$TARGET" = "prepare-release" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            if [ "$BUMP" = "none" ]; then
              echo "No version bump needed (current: ${CURRENT:-none})."
            elif [ "$DRY_RUN" = "true" ]; then
              echo "[dry-run] would bump to $NEXT and open/update release/$NEXT"
            else
              echo "Release PR ready; auto-merge takes it, then run target=publish."
            fi
            exit 0
          fi
          # publish: tag merged main (or rebuild ref), then build it.
          if [ -n "$INPUT_REF" ]; then
            TAG="$INPUT_REF"
            echo "Rebuilding existing tag $TAG."
          else
            MANIFEST_VER="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
            [ -n "$MANIFEST_VER" ] || { echo "::error::No version in Cargo.toml"; exit 1; }
            TAG="v$MANIFEST_VER"
            if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
              echo "Tag $TAG already exists; building it."
            elif [ "$DRY_RUN" = "true" ]; then
              echo "[dry-run] would create tag $TAG, build it, and publish the release"
            else
              git config user.name "github-actions[bot]"
              git config user.email "actions@users.noreply.github.com"
              git tag -a "$TAG" -m "Release $TAG"
              git push origin "refs/tags/$TAG"
            fi
          fi
          if [ "$DRY_RUN" = "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          { echo "ref=$TAG"; echo "version=${TAG#v}"; echo "publish=true"; echo "skip=false"; } >> "$GITHUB_OUTPUT"

  build:
    name: Build & Release Artifacts
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          fetch-depth: 0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to ghcr.io
        if: needs.prepare.outputs.publish == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.prepare.outputs.ref }}
            type=raw,value=latest

      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          push: ${{ needs.prepare.outputs.publish == 'true' }}
          load: ${{ needs.prepare.outputs.publish != 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish Consolidated Release
        if: needs.prepare.outputs.publish == 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ needs.prepare.outputs.ref }}
          generate_release_notes: true
          body: |
            Container image:

            ```
            podman pull ${{ env.IMAGE }}:${{ needs.prepare.outputs.version }}
            ```

            Or `latest` for the most recent release. The git tag `${{ needs.prepare.outputs.ref }}`
            is the same image, named the way git wants it.
