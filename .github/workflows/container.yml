name: Container

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  # Weekly, because the things this cannot catch still move under our feet: a
  # distribution package security update changes the base image without a commit.
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  # `just check` proves the Rust builds and its pure functions behave. Nothing
  # proves the container does, which is where every interesting failure lives.
  #
  # What this job can and cannot do is worth stating plainly, because it took
  # several attempts to find out. GitHub-hosted runners cannot run this image.
  # The browser is installed unprivileged, so nothing can make Chromium's SUID
  # sandbox helper root-owned, and the runner's kernel policy forbids
  # unprivileged user namespaces, which is the only sandbox left. The browser
  # therefore exits with "No usable sandbox!" and the supervisor correctly
  # takes the container down with it. Unconfining AppArmor does not help;
  # Docker's default seccomp profile blocks the clone(CLONE_NEWUSER) the
  # namespace sandbox needs.
  #
  # So this asserts what is still meaningful on a machine that cannot host the
  # product: that the image builds at all, that the browser installs
  # unprivileged and records what it unpacked, that the unusable SUID helper is
  # gone, and that the failure is the documented one rather than a mystery. The
  # full functional check - the web UI, the CDP bridge, the browser running -
  # needs a host with user namespaces, and lives in scripts/smoke.sh for that.
  smoke:
    name: Container (build + install)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          tags: headless-brave:smoke
          # Same cache the release build writes, so this is cheap on the runs
          # that follow a real change.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start it
        # --shm-size matches the compose file: Chromium is unhappy on Docker's
        # 64 MB default, and a bare `docker run` without it is not what we ship.
        run: >
          docker run -d --name smoke --shm-size=2g
          -p 127.0.0.1:18000:8000
          headless-brave:smoke

      - name: The browser installed, unprivileged
        run: |
          # Read with `docker cp` rather than `docker exec`: this container is
          # expected to have stopped by now, because the browser cannot sandbox
          # here, and exec needs it running. `cp` reads a stopped container's
          # filesystem, which is exactly what is wanted - the install has to
          # have happened even though the browser could not start.
          for _ in $(seq 1 30); do
            if docker cp smoke:/opt/brave.com/VERSION /tmp/VERSION 2>/dev/null; then
              echo "installed $(cat /tmp/VERSION)"
              exit 0
            fi
            sleep 5
          done
          echo "the browser never finished installing" >&2
          exit 1

      - name: The unusable SUID helper is gone
        run: |
          # Left in place, Chromium selects it and then aborts fatally instead
          # of falling back to the namespace sandbox.
          if docker cp smoke:/opt/brave.com/brave-origin/chrome-sandbox /tmp/helper 2>/dev/null; then
            echo "the unusable SUID sandbox helper is still installed" >&2
            exit 1
          fi

      - name: It is configured to run unprivileged
        run: |
          # The container's user is the image's, and the image's is the
          # unprivileged one. This is the invariant the whole design rests on,
          # and it is the one thing about a stopped container that can still be
          # asserted from outside.
          test "$(docker inspect smoke --format '{{.Config.User}}')" = "headless"

      - name: It fails in the documented way here
        run: |
          # This host cannot sandbox the browser, so the container is expected
          # to stop and to say which part stopped. An unexplained exit is the
          # failure worth catching; the sandbox one is the environment talking.
          for _ in $(seq 1 30); do
            state=$(docker inspect smoke --format '{{.State.Running}}' 2>/dev/null || echo gone)
            [ "$state" = "false" ] && break
            [ "$state" = "gone" ] && break
            sleep 5
          done
          docker logs smoke > /tmp/smoke.log 2>&1 || true
          grep -qE "No usable sandbox" /tmp/smoke.log \
            || grep -qE "Brave .*exited" /tmp/smoke.log \
            || { echo "the container stopped without saying why"; exit 1; }

      # Last and unconditional: a job that fails without saying why is worse
      # than none.
      - name: What happened
        if: always()
        run: |
          echo "=== container state ==="
          docker ps -a --filter name=smoke --format '{{.Status}}'
          echo "=== exit code ==="
          docker inspect smoke --format '{{.State.ExitCode}}' || true
          echo "=== the supervisor's own log, and anything fatal ==="
          # The whole log, not a tail: the supervisor announces itself before it
          # starts anything, so its first line is at the head, and fluxbox then
          # buries it under a line per preference it could not read.
          grep -iE "headless-brave|error|fatal|sandbox|namespace|exited" /tmp/smoke.log \
            | grep -viE "Failed to read|Setting default value" | head -30 || true

      - name: Clean up
        if: always()
        run: docker rm -f smoke || true
