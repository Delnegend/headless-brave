[package]
name = "headless-brave-web"
version = "0.2.2"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Web UI and WebSocket bridges for the headless-brave container"

# Every dependency is pinned to the exact version in Cargo.lock. This is a
# binary that ships inside an image, not a library anyone else resolves
# against, so there is nothing to gain from a looser requirement and a rebuild
# a year from now should produce the same thing.
[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
bytes = "1.12.1"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
http-body-util = "0.1.5"
libc = "0.2.180"
hyper = { version = "1.11.1", features = ["client", "http1"] }
hyper-util = { version = "0.1.21", features = ["client-legacy", "tokio"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = "0.30.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.26.1", features = ["v4"] }

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"

[profile.release]
lto = "thin"
strip = true
